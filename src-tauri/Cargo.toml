[package]
name = "sentry-neko"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "sentry_neko_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# The released 2.5.4 can start duplicates during concurrent Windows startup (upstream #3704).
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "6c9746e5515491a25c9d8c168c73e43a9edec6bb" }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
ureq = { version = "3", default-features = false, features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
