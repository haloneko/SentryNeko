<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Three checklist rows on a transparent canvas: a solid disc, then two empty rings, each with
       its line. Discs and rings are 220 across, lines 620 wide, and every row shares one left and
       one right edge. -->
  <g>
    <!-- Row 1: accent purple, solid. -->
    <circle cx="172" cy="248" r="110" fill="#8B7CF6" />
    <rect x="342" y="198" width="620" height="100" rx="50" fill="#8B7CF6" />

    <!-- Row 2: cyan, empty. -->
    <circle cx="172" cy="512" r="86" fill="none" stroke="#2BA6C9" stroke-width="48" />
    <rect x="342" y="462" width="620" height="100" rx="50" fill="#2BA6C9" />

    <!-- Row 3: green, empty. -->
    <circle cx="172" cy="776" r="86" fill="none" stroke="#35B87C" stroke-width="48" />
    <rect x="342" y="726" width="620" height="100" rx="50" fill="#35B87C" />
  </g>
</svg>
