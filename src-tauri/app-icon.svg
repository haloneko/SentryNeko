<!--
  SentryNeko application icon.

  Original cat-and-clock mark, licensed under the project's Apache License 2.0.
  The flat slate, violet and off-white palette matches src/styles/app.css.
  Broad silhouettes and clock hands keep the mark legible at tray sizes.

  After editing this file, regenerate the platform icon set with:
    pnpm icons
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect x="32" y="32" width="960" height="960" rx="216" fill="#141821" />
  <rect x="40" y="40" width="944" height="944" rx="208" fill="none" stroke="#38414F" stroke-width="16" />

  <!-- The ears and rounded head identify Neko; the inset dial represents focused time. -->
  <path fill="#8B7CF6" d="M240 448V240Q240 216 260 228L400 320Q512 288 624 320L764 228Q784 216 784 240V448Q832 512 832 592C832 760 696 848 512 848S192 760 192 592Q192 512 240 448Z" />
  <circle cx="512" cy="584" r="192" fill="#141821" />
  <path d="M512 464V584L600 640" fill="none" stroke="#E9ECF3" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
</svg>
